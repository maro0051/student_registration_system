{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>
        Courses
    </h2>

    <a
        href="/courses/create/"
        class="btn btn-primary"
    >
        Add Course
    </a>

</div>

<form method="GET" class="mb-4">

    <input
        type="text"
        name="search"
        class="form-control"
        placeholder="Search courses..."
        value="{{ request.GET.search }}"
    >

</form>

<div class="card shadow">

    <div class="card-body">

        <table class="table table-hover">

            <thead>

                <tr>

                    <th>Code</th>

                    <th>Name</th>

                    <th>Instructor</th>

                    <th>Credits</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

                {% for course in courses %}

                <tr>

                    <td>
                        {{ course.code }}
                    </td>

                    <td>
                        {{ course.name }}
                    </td>

                    <td>
                        {{ course.instructor }}
                    </td>

                    <td>
                        {{ course.credits }}
                    </td>

                    <td>

                        <a
                            href="/courses/{{ course.id }}/edit/"
                            class="btn btn-warning btn-sm"
                        >
                            Edit
                        </a>

                        <a
                            href="/courses/{{ course.id }}/delete/"
                            class="btn btn-danger btn-sm"
                        >
                            Delete
                        </a>

                    </td>

                </tr>

                {% empty %}

                <tr>

                    <td colspan="5">
                        No courses found.
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
